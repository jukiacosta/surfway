<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat dos Surfistas</title>
  <link rel="stylesheet" href="../css/chat.css" />
</head>
<body>
  <div class="chat-container">
    <header>
      <h2>Chat dos Surfistas</h2>
    </header>

    <main class="chat-messages" id="chatMessages">
      <div class="message received">E aí, já conferiu as ondas hoje?</div>
      <div class="message sent">Sim! Tava irado no Campeche </div>
    </main>

    <form id="chatForm" class="chat-form">
      <input type="text" id="msgInput" placeholder="Digite sua mensagem..." autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script>
    const chatForm = document.getElementById('chatForm');
    const chatMessages = document.getElementById('chatMessages');
    const msgInput = document.getElementById('msgInput');

    chatForm.addEventListener('submit', e => {
      e.preventDefault();
      const msg = msgInput.value.trim();
      if(msg) {
        const newMsg = document.createElement('div');
        newMsg.classList.add('message', 'sent');
        newMsg.textContent = msg;
        chatMessages.appendChild(newMsg);
        msgInput.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    });
  </script>
</body>
</html>
